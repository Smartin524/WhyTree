<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhyTree</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/canvas.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/lab.css">
</head>
<body>
<header class="bar">
  <div class="brand">Why<b>Tree</b></div>
  <div id="topic"></div>
  <div class="legend"><i class="is-problem"></i>问题 <i class="is-solution"></i>方案</div>
  <label class="field field--search">
    <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input id="search" type="search" name="whytree-node-filter" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="搜索标题、标签、类型" aria-label="搜索节点">
  </label>
  <span class="bar__sep"></span>
  <div class="bar__spacer"></div>
  <button id="btnLab" title="打开交互演练：用同一组数字一步步走完正向、反向、训练">交互演练</button>
  <button id="btnRecall" title="把方案遮住，先自己想怎么解决，再点开核对">回忆模式</button>
  <button id="btnCollapse" title="折叠 / 展开全部">全部折叠</button>
  <button id="btnFit" title="重新适应窗口大小，并回到最左边">适应</button>
</header>

<main id="viewport" class="viewport">
  <div id="sizer" class="sizer">
    <div id="world" class="world">
      <svg id="edges" class="edges"></svg>
      <div id="nodes"></div>
    </div>
  </div>
</main>

<aside id="panel" class="panel" hidden></aside>
<div id="lab" class="lab" hidden></div>

<!-- 内容：概念库 + 各主题。新增主题只需在这里加一行 -->
<script src="topics/concepts.js"></script>
<script src="topics/basics.js"></script>
<script src="topics/sequence.js"></script>
<script src="topics/cuda.js"></script>
<script src="topics/agent.js"></script>
<script src="topics/transformer.js"></script>
<script src="topics/redis.js"></script>

<!-- 程序：顺序有依赖，不能乱 -->
<script src="js/util.js"></script>
<script src="js/dropdown.js"></script>
<script src="js/graph.js"></script>
<script src="js/canvas.js"></script>
<script src="js/lab.js"></script>
<script src="js/labs/nn-vcurve.js"></script>
<script src="js/labs/vanish.js"></script>
<script src="js/panel.js"></script>
<script src="js/main.js"></script>
</body>
</html>
